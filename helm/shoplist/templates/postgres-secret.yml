# postgres-secret.yml - postgres passwords
# Values are base64-encoded. How to encode: guide, step 3 (PowerShell or Git Bash)
apiVersion: v1
kind: Secret                  # which resource stores sensitive data?
metadata:
  name: postgres-secret     # postgres-deployment and backend-deployment look up this exact name
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  POSTGRES_DB: {{ .Values.postgres.database | b64enc | quote }}         # shoplist, base64-encoded
  POSTGRES_USER: {{ .Values.postgres.user | b64enc | quote }}       # shopuser, base64-encoded
  POSTGRES_PASSWORD: {{ .Values.postgres.password | b64enc | quote }}   # shoppass, base64-encoded
