# frontend-deployment.yml - your turn (step 9c). Blank page
# Hint: copy stats-deployment.yml here and delete what you don't need
#
# Checklist:
#   [ ] four levels: apiVersion, kind, metadata, spec
#   [ ] app: frontend in two places, identical
#   [ ] image: shoplist-frontend:local and imagePullPolicy: Never
#   [ ] containerPort: 80
#   [ ] no env, no Secret, no readinessProbe
#
# Before apply: kubectl apply --dry-run=server -f kubernetes/frontend-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend                # exactly the same label as above
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }} 
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources:
            requests:
              cpu: {{ .Values.frontend.resources.requests.cpu | quote }}
              memory: {{ .Values.frontend.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.frontend.resources.limits.cpu | quote }}
              memory: {{ .Values.frontend.resources.limits.memory | quote }}
          ports:
            - containerPort: 80 
